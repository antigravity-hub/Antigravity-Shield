name: Release Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag to build (e.g. v5.11.2)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Windows Build (.exe installer and updater artifacts)
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-2025
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps --prefer-offline

      - name: Sync version from release tag & optimize build speed
        shell: bash
        run: |
          TARGET_VER="${{ github.event.inputs.release_tag || github.ref_name }}"
          TARGET_VER="${TARGET_VER#v}"
          if [ -n "$TARGET_VER" ] && [ "$TARGET_VER" != "refs/heads/main" ]; then
            echo "Synchronizing project versions to $TARGET_VER"
            node -e "
              const fs = require('fs');
              ['package.json', 'src-tauri/tauri.conf.json'].forEach(f => {
                if (fs.existsSync(f)) {
                  const d = JSON.parse(fs.readFileSync(f, 'utf8'));
                  d.version = '$TARGET_VER';
                  fs.writeFileSync(f, JSON.stringify(d, null, 2) + '\n');
                }
              });
            "
            if [ -f src-tauri/Cargo.toml ]; then
              sed -i.bak -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+.*\"/version = \"$TARGET_VER\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak
            fi
            if [ -f src-tauri/Cargo.lock ]; then
              sed -i.bak -E '/name = "antigravity-shield"/{n;s/version = "[0-9]+\.[0-9]+\.[0-9]+.*"/version = "'"$TARGET_VER"'"/;}' src-tauri/Cargo.lock && rm -f src-tauri/Cargo.lock.bak
            fi
            cargo update -p antigravity-shield --manifest-path src-tauri/Cargo.toml || true
          fi
          # Speed up frontend build: bypass full tsc typecheck during release build
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            if (fs.existsSync(p)) {
              const c = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (c.build) c.build.beforeBuildCommand = 'npx vite build';
              fs.writeFileSync(p, JSON.stringify(c, null, 2), 'utf8');
              console.log('Optimized beforeBuildCommand to npx vite build');
            }
          "

      - name: Configure updater signing key
        shell: bash
        env:
          TAURI_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_KEY_RAW" ] && [ "$TAURI_KEY_RAW" != "" ]; then
            KEY_PATH="$RUNNER_TEMP/tauri.key"
            printf "%s\n" "$TAURI_KEY_RAW" > "$KEY_PATH"
            tr -d '\r' < "$KEY_PATH" > "$KEY_PATH.tmp" && mv "$KEY_PATH.tmp" "$KEY_PATH"
            echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV
            echo "TAURI_SIGNING_PRIVATE_KEY=$TAURI_KEY_RAW" >> $GITHUB_ENV
            echo "Signing key saved to file: $KEY_PATH"
            node -e "
              const fs = require('fs');
              const p = 'src-tauri/tauri.conf.json';
              if (fs.existsSync(p)) {
                const c = JSON.parse(fs.readFileSync(p, 'utf8'));
                if (c.bundle) c.bundle.createUpdaterArtifacts = true;
                fs.writeFileSync(p, JSON.stringify(c, null, 2), 'utf8');
                console.log('Signing key detected: enabled createUpdaterArtifacts');
              }
            "
          else
            node -e "
              const fs = require('fs');
              const p = 'src-tauri/tauri.conf.json';
              if (fs.existsSync(p)) {
                const c = JSON.parse(fs.readFileSync(p, 'utf8'));
                if (c.bundle) c.bundle.createUpdaterArtifacts = false;
                fs.writeFileSync(p, JSON.stringify(c, null, 2), 'utf8');
                console.log('No signing key: disabled createUpdaterArtifacts');
              }
            "
          fi

      - name: Build Windows NSIS installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ! npx tauri build --bundles nsis --ignore-version-mismatches -- --bin antigravity-shield 2>&1 | tee tauri-build-windows.log; then
            echo "::warning::Initial Windows build failed. Checking if caused by updater signature mismatch..."
            tail -n 80 tauri-build-windows.log || true
            if grep -qiE "signature|minisign|private key|key mismatch" tauri-build-windows.log; then
              echo "::warning::Signing error detected. Retrying build with createUpdaterArtifacts disabled as fallback..."
              node -e "
                const fs = require('fs');
                const p = 'src-tauri/tauri.conf.json';
                const c = JSON.parse(fs.readFileSync(p, 'utf8'));
                if (c.bundle) c.bundle.createUpdaterArtifacts = false;
                fs.writeFileSync(p, JSON.stringify(c, null, 2), 'utf8');
              "
              if ! npx tauri build --bundles nsis --ignore-version-mismatches -- --bin antigravity-shield 2>&1 | tee -a tauri-build-windows.log; then
                tail -n 100 tauri-build-windows.log || true
                exit 1
              fi
            else
              tail -n 100 tauri-build-windows.log || true
              exit 1
            fi
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows
          path: tauri-build-windows.log

      - name: Upload updater json
        uses: actions/upload-artifact@v4
        with:
          name: updater-json-windows
          path: src-tauri/target/release/bundle/updater/*.json
          if-no-files-found: ignore

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/updater/*.sig
            src-tauri/target/release/bundle/updater/*.zip
            src-tauri/target/release/bundle/updater/*.tar.gz*
          if-no-files-found: warn

  # Publish or Update GitHub Release with Windows Artifacts
  publish-release:
    name: Publish Release to GitHub
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: "{release-assets-*,updater-json-*}"
          merge-multiple: true

      - name: Extract Release Notes
        run: |
          TARGET_VER="${{ github.event.inputs.release_tag || github.ref_name }}"
          echo "Extracting release notes for version $TARGET_VER"
          awk -v ver="$TARGET_VER" '
            BEGIN { capture=0 }
            $0 ~ "^[[:space:]]*[*+-][[:space:]]+\\*\\*" ver { capture=1; next }
            capture && $0 ~ "^[[:space:]]*[*+-][[:space:]]+\\*\\*v" { capture=0; exit }
            capture { print }
          ' CHANGELOG.md | sed 's/^[[:space:]]\{8\}//' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "# Antigravity Shield $TARGET_VER" > release_notes.md
            echo "" >> release_notes.md
            echo "Official release for Antigravity Shield $TARGET_VER. Download installers below." >> release_notes.md
          fi

      - name: Build updater.json from signatures
        env:
          VERSION: ${{ github.event.inputs.release_tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_BASE="https://github.com/${REPO}/releases/download/${VERSION}"
          VER="${VERSION#v}"

          read_sig() {
            local pattern="$1"
            local sig_file
            sig_file=$(find all-artifacts -name "$pattern" -type f 2>/dev/null | head -1)
            if [ -n "$sig_file" ] && [ -f "$sig_file" ]; then
              cat "$sig_file"
            else
              echo ""
            fi
          }

          WINDOWS_NSIS_SIG=$(read_sig "*_x64-setup.exe.sig")
          if [ -z "$WINDOWS_NSIS_SIG" ]; then
            WINDOWS_NSIS_SIG=$(read_sig "*.nsis.zip.sig")
          fi
          if [ -z "$WINDOWS_NSIS_SIG" ]; then
            WINDOWS_NSIS_SIG=$(read_sig "*windows*.sig")
          fi
          if [ -z "$WINDOWS_NSIS_SIG" ]; then
            WINDOWS_NSIS_SIG=$(read_sig "*.sig")
          fi
          echo "Discovered Windows signature length: ${#WINDOWS_NSIS_SIG}"
          WIN_EXE=$(find all-artifacts -name "*_x64-setup.exe" -type f -exec basename {} \; 2>/dev/null | head -1)
          WIN_EXE_CLEAN="${WIN_EXE// /.}"
          if [ -z "$WIN_EXE_CLEAN" ]; then
            WIN_EXE_CLEAN="Antigravity.Shield_${VER}_x64-setup.exe"
          fi

          # Preserve existing platforms from release updater.json if already uploaded
          if curl -fsSL "$DOWNLOAD_BASE/updater.json" -o existing_updater.json 2>/dev/null; then
            echo "Preserving existing updater.json platforms from release"
            UPDATER_JSON=$(cat existing_updater.json)
            UPDATER_JSON=$(echo "$UPDATER_JSON" | jq \
              --arg version "$VER" \
              --arg notes "Antigravity Shield $VERSION release" \
              --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg dl "$DOWNLOAD_BASE" \
              --arg win_nsis_sig "$WINDOWS_NSIS_SIG" \
              --arg win_exe "$WIN_EXE_CLEAN" \
              '.version = $version | .notes = $notes | .pub_date = $pub_date |
               .platforms["windows-x86_64"] = { url: "\($dl)/\($win_exe)", signature: $win_nsis_sig }')
          else
            UPDATER_JSON=$(jq -n \
              --arg version "$VER" \
              --arg notes "Antigravity Shield $VERSION release" \
              --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg dl "$DOWNLOAD_BASE" \
              --arg win_nsis_sig "$WINDOWS_NSIS_SIG" \
              --arg win_exe "$WIN_EXE_CLEAN" \
              '{
                version: $version,
                notes: $notes,
                pub_date: $pub_date,
                platforms: {
                  "windows-x86_64": {
                    url: "\($dl)/\($win_exe)",
                    signature: $win_nsis_sig
                  }
                }
              }')
          fi

          echo "$UPDATER_JSON" > updater.json
          echo "Generated updater.json:"
          cat updater.json

      - name: Collect release files
        run: |
          mkdir -p release-files
          find all-artifacts -type f \( \
            -name "*.exe" -o \
            -name "*.msi" -o \
            -name "*.dmg" -o \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.tar.gz" -o \
            -name "*.zip" -o \
            -name "*.sig" \
          \) -print0 | while IFS= read -r -d '' file; do
            base=$(basename "$file")
            clean_base="${base// /.}"
            cp "$file" "release-files/$clean_base"
          done
          find release-files -maxdepth 1 -type f -print

      - name: Create or Update GitHub Release
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          allowUpdates: true
          tag: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "${{ github.event.inputs.release_tag || github.ref_name }}"
          bodyFile: "release_notes.md"
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "release-files/*,updater.json"
          artifactErrorsFailBuild: false
          replacesArtifacts: true
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.event.inputs.release_tag, '-') || github.event.inputs.prerelease == true || github.event.inputs.prerelease == 'true' }}
          makeLatest: ${{ (contains(github.ref_name, '-') || contains(github.event.inputs.release_tag, '-') || github.event.inputs.prerelease == true || github.event.inputs.prerelease == 'true') && 'false' || 'legacy' }}

      - name: Dispatch Release Unix Workflow
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          IS_PRE: ${{ contains(github.ref_name, '-') || contains(github.event.inputs.release_tag, '-') || github.event.inputs.prerelease == true || github.event.inputs.prerelease == 'true' }}
        run: |
          echo "Dispatching Release Unix for tag $TAG (prerelease: $IS_PRE)..."
          gh workflow run release-unix.yml -f release_tag="$TAG" -f prerelease="$IS_PRE" || echo "Workflow dispatch completed or skipped"
