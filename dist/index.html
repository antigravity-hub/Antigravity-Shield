<!doctype html>
<html lang="en" style="background-color: #1a1f2e;">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Shield</title>
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('app-theme-preference');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        // Antigravity Shield is an Obsidian Dark theme by default; only switch to light if user explicitly selected light
        const shouldBeDark = savedTheme !== 'light';

        // Set background color IMMEDIATELY to SPLASH COLOR (seamless transition)
        document.documentElement.style.backgroundColor = shouldBeDark ? '#060807' : '#FAFBFC';

        if (shouldBeDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {
        console.error('Failed to apply theme during boot:', e);
        document.documentElement.style.backgroundColor = '#060807';
      }
    })();
  </script>
